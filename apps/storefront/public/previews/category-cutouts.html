<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Category cutouts preview — Buy n Try</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --forest: #2a4633;
        --sage: #5c7a6a;
        --gold: #c4a574;
        --terra: #a65d47;
        --cream: #f5efe6;
        --charcoal: #1a202c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--cream);
        color: var(--charcoal);
        padding: 2rem 1rem 3rem;
      }
      h1 {
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 0.25rem;
      }
      p.lead {
        text-align: center;
        color: #4a5568;
        max-width: 36rem;
        margin: 0 auto 2rem;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem 2rem;
        justify-content: center;
        max-width: 56rem;
        margin: 0 auto;
      }
      .tile {
        text-align: center;
        width: 7rem;
      }
      .circle {
        width: 7rem;
        height: 7rem;
        border-radius: 9999px;
        margin: 0 auto 0.65rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf6ee;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .bg-0 { box-shadow: 0 0 0 3px #0e2419, 0 4px 14px rgba(0,0,0,.1); }
      .bg-1 { box-shadow: 0 0 0 3px #5c7a6a, 0 4px 14px rgba(0,0,0,.1); }
      .bg-2 { box-shadow: 0 0 0 3px #8a7350, 0 4px 14px rgba(0,0,0,.1); }
      .bg-3 { box-shadow: 0 0 0 3px #a65d47, 0 4px 14px rgba(0,0,0,.1); }
      .circle img {
        width: 86%;
        height: 86%;
        object-fit: contain;
      }
      .label {
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.3;
      }
      .checker {
        background-image: linear-gradient(45deg, #ccc 25%, transparent 25%),
          linear-gradient(-45deg, #ccc 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #ccc 75%),
          linear-gradient(-45deg, transparent 75%, #ccc 75%);
        background-size: 12px 12px;
        background-position: 0 0, 0 6px, 6px -6px, -6px 0;
        border: 2px dashed #888;
      }
      section.raw {
        margin-top: 3rem;
        max-width: 56rem;
        margin-left: auto;
        margin-right: auto;
      }
      section.raw h2 {
        font-size: 1rem;
        margin-bottom: 1rem;
      }
      .raw-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 1rem;
      }
      .raw-grid figure {
        margin: 0;
        text-align: center;
        font-size: 0.7rem;
      }
      .raw-grid img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
      }
      a.home {
        display: block;
        text-align: center;
        margin-top: 2rem;
        color: var(--forest);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Category WebP cutouts</h1>
    <p class="lead">
      Transparent product-only assets on the same colored circles as the live
      shop category row. Open the homepage and scroll to “Shop by Categories” to
      compare.
    </p>
    <div class="grid" id="tiles"></div>
    <section class="raw">
      <h2>Transparency check (checkerboard)</h2>
      <div class="raw-grid" id="raw"></div>
    </section>
    <a class="home" href="/">← Back to storefront home</a>
    <script>
      const items = [
        { label: "Smartwatches", file: "smartwatch.webp" },
        { label: "Power Banks", file: "power-bank.webp" },
        { label: "Chargers", file: "charger.webp" },
        { label: "Earbuds", file: "earbuds.webp" },
        { label: "Ring Lights", file: "ring-light.webp" },
        { label: "Selfie Sticks", file: "selfie-stick.webp" },
        { label: "Tripods", file: "tripod.webp" },
        { label: "Microphones", file: "microphone.webp" },
        { label: "Accessories", file: "accessories.webp" },
      ];
      const tiles = document.getElementById("tiles");
      const raw = document.getElementById("raw");
      items.forEach((item, i) => {
        const src = `/categories/${item.file}`;
        const t = document.createElement("div");
        t.className = "tile";
        t.innerHTML = `<div class="circle bg-${i % 4}"><img src="${src}" alt="" /></div><div class="label">${item.label}</div>`;
        tiles.appendChild(t);
        const fig = document.createElement("figure");
        fig.innerHTML = `<div class="checker"><img src="${src}" alt="" /></div><figcaption>${item.file}</figcaption>`;
        raw.appendChild(fig);
      });
    </script>
  </body>
</html>

name: Monorepo CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/admin-*", "codex/product-*", "codex/collection-*", "codex/isolated-staging-certification"]

concurrency:
  group: storefront-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Prepare disposable PostgreSQL image
        run: docker pull postgres:17-alpine
      - name: Product integrity transactions and concurrency
        run: node scripts/test-product-integrity.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Admin streaming dependency and behavior contracts
        run: node --import tsx --test scripts/check-admin-streaming-compatibility.test.mjs
      - name: Local staging safety contracts
        run: node --test scripts/local-staging/isolation.test.mjs scripts/local-staging/browser-https.test.mjs scripts/local-staging/browser-pki.test.mjs scripts/local-staging/browser-https-recover.test.mjs scripts/local-staging/browser-debug-cleanup.test.mjs
      - name: Reviewed migration runner plan contracts
        run: node --test scripts/local-staging/release-migration-plan.test.mjs
      - name: Lint storefront and admin
        run: npm run lint:all
      - name: Type-check storefront
        run: npm run typecheck:storefront
      - name: Type-check admin
        run: npm run typecheck:admin
      - name: Build storefront
        run: npm run build:storefront
        env:
          NEXT_PUBLIC_SITE_URL: https://buyntryy.com
          ADMIN_TOKEN: ci-placeholder-not-for-production
      - name: Enforce storefront performance budgets
        run: npm run check:performance-budget
      - name: Build admin
        run: npm run build:admin
        env:
          ADMIN_TOKEN: ci-placeholder-not-for-production

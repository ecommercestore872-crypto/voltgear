name: Monorepo CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/admin-*", "codex/product-*"]

concurrency:
  group: storefront-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Lint storefront and admin
        run: npm run lint:all
      - name: Type-check storefront
        run: npm run typecheck:storefront
      - name: Type-check admin
        run: npm run typecheck:admin
      - name: Build storefront
        run: npm run build:storefront
        env:
          NEXT_PUBLIC_SITE_URL: https://buyntryy.com
          ADMIN_TOKEN: ci-placeholder-not-for-production
      - name: Enforce storefront performance budgets
        run: npm run check:performance-budget
      - name: Build admin
        run: npm run build:admin
        env:
          ADMIN_TOKEN: ci-placeholder-not-for-production

name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: storefront-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Build storefront
        run: npm run build:storefront
        env:
          NEXT_PUBLIC_SITE_URL: https://buyntryy.com
          ADMIN_TOKEN: ci-placeholder-not-for-production
      - name: Build admin
        run: npm run build:admin
        env:
          ADMIN_TOKEN: ci-placeholder-not-for-production
